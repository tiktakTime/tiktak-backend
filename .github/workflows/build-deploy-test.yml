name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: self-hosted
    steps:
      # Avoid actions/checkout (GitHub Actions CDN 503 breaks Set up job)
      - name: Checkout Repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ORIGIN="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -d .git ]; then
            git remote set-url origin "$ORIGIN"
          else
            git init
            git remote add origin "$ORIGIN"
          fi
          git fetch --force origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          git clean -ffdx

      - name: Build Docker Image
        run: |
          sudo docker build --no-cache -f Dockerfile -t tiktak-backend-test:latest .
        shell: bash

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy to Server
        run: |
          sudo bash -c 'cd /root/ && docker compose up -d tiktak-backend-test --force-recreate'
        shell: bash
