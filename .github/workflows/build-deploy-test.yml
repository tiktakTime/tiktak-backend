name: CI/CD Pipeline

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  # PR'da da koşar — ihlal branch'e girmeden yakalanır.
  quality:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate
        shell: bash

      - name: Install
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Generate Prisma client
        run: pnpm db:generate:ci
        shell: bash

      - name: Verify (format + tsc + lint + arch + test)
        run: pnpm verify
        shell: bash

  build:
    runs-on: self-hosted
    needs: quality
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          sudo docker build --no-cache -f Dockerfile -t tiktak-backend-test:latest .
        shell: bash

  deploy:
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy to Server
        run: |
          sudo bash -c 'cd /root/ && docker compose up -d tiktak-backend-test --force-recreate'
        shell: bash
